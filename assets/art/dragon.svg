<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="body" gradientUnits="userSpaceOnUse" x1="860" y1="420" x2="1800" y2="900">
      <stop offset="0" stop-color="#6a2812"/>
      <stop offset="0.35" stop-color="#2a0e0a"/>
      <stop offset="1" stop-color="#080304"/>
    </linearGradient>
    <linearGradient id="bodyV" gradientUnits="userSpaceOnUse" x1="0" y1="380" x2="0" y2="1080">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="0.5" stop-color="#d4501a"/>
      <stop offset="1" stop-color="#40100a"/>
    </linearGradient>
    <linearGradient id="membrane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a2410" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#1a0606" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="membraneNear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a1008"/>
      <stop offset="1" stop-color="#0a0304"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#150907"/>
      <stop offset="0.55" stop-color="#5a4232"/>
      <stop offset="1" stop-color="#b8a07a"/>
    </linearGradient>
    <radialGradient id="eyeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe070" stop-opacity="1"/>
      <stop offset="0.3" stop-color="#ff9a1a" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ff4a0a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mouthGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff0a0" stop-opacity="1"/>
      <stop offset="0.3" stop-color="#ffb02a" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#e0480a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#a02004" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tooth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0e4c0"/>
      <stop offset="1" stop-color="#9a8660"/>
    </linearGradient>
  </defs>

  <!-- ========== FAR WING ========== -->
  <g>
